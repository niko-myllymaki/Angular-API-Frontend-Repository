<p>{{homeTitle()}}</p>

<main>
    <input [ngClass]="{'red-background':usernameError, '':!usernameError}" name="username" [(ngModel)] = "username" placeholder="Username here..."><br>
    @if (usernameError) {
        <p class="error">{{messages.errors.userFieldEmpty}}</p>
    } 
    <input [ngClass]="{'red-background':passwordError, '':!passwordError}" type="password" name="password" [(ngModel)] = "password" placeholder="Password here..."><br>
    @if (passwordError) {
        <p class="error">{{messages.errors.passwordFieldEmpty}}</p>
    } 
    <div [ngClass]="{'role-error-background':roleError, '':!roleError}">
        @for (role of roles; track role) {
            <input [checked]="accepted" (change)="onChange(role)" type="checkbox" value="{{ role }}" />{{role}}<br>
        }
    </div>
    @if (roleError) {
        <p class="error">{{messages.errors.roleFieldEmpty}}</p>
    } 

   
    <button (click)="signUpClicked()">Sign up</button>

    <p>API Response: {{ response() }}</p>

</main>
